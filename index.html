<!DOCTYPE html>

<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title id="siteTitle">ZZ XTREAM - Yönetim ve Aktivasyon Merkezi</title>

<style>

body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; position: relative; }

.lang-switcher { position: absolute; top: 20px; right: 20px; display: flex; gap: 8px; }

.lang-btn { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: bold; transition: all 0.3s; }

.lang-btn.active { background: #f39c12; color: #121212; border-color: #f39c12; }

.container { background-color: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; width: 100%; max-width: 450px; margin-top: 40px; }

h2 { color: #f39c12; margin-top: 0; margin-bottom: 5px; }

.subtitle { color: #aaaaaa; font-size: 14px; margin-bottom: 25px; }

.card { background: #2a2a2a; padding: 20px; border-radius: 8px; margin-bottom: 20px; text-align: left; border-top: 4px solid #f39c12; }

.card h3 { margin: 0 0 15px 0; font-size: 16px; color: #f39c12; }

.input-group { margin-bottom: 15px; }

label { display: block; margin-bottom: 6px; color: #dddddd; font-size: 13px; }

.instructions { background: #1a1a1a; padding: 10px; border-radius: 6px; font-size: 12px; color: #f1c40f; margin-bottom: 12px; border-left: 3px solid #f39c12; line-height: 1.4; }

.account-badge { background: #1a1a1a; padding: 8px 10px; border-radius: 6px; font-size: 12px; color: #3498db; margin-bottom: 12px; border-left: 3px solid #2980b9; line-height: 1.4; word-break: break-all; }

input[type="text"], input[type="file"] { width: 100%; padding: 10px; border: 1px solid #444; border-radius: 6px; background-color: #1a1a1a; color: #fff; box-sizing: border-box; font-size: 14px; }

input[type="text"] { text-align: center; }

input[type="text"]:read-only { color: #999; background-color: #151515; cursor: not-allowed; }

input[type="file"] { cursor: pointer; padding: 8px; }

input:focus { border-color: #f39c12; outline: none; }

.btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 5px; }

.btn-orange { background-color: #f39c12; color: #121212; }

.btn-orange:hover { background-color: #e67e22; }

.btn-blue { background-color: #2980b9; color: #fff; }

.btn-blue:hover { background-color: #3498db; }

.divider { text-align: center; margin: 15px 0; font-size: 12px; color: #777; text-transform: uppercase; font-weight: bold; }

#loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 9999; display: none; }

</style>

<!-- Firebase SDK'ları -->

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

</head>

<body>



<div id="loadingOverlay"><div style="color: #f39c12; font-weight: bold;">Güvenli Bağlantı Kuruluyor...</div></div>



<div class="lang-switcher">

<button class="lang-btn active" id="btnLangTR" onclick="setLanguage('tr')">TR</button>

<button class="lang-btn" id="btnLangEN" onclick="setLanguage('en')">EN</button>

</div>



<div class="container">

<h2 id="mainTitle">ZZ XTREAM Kontrol Paneli</h2>

<div class="subtitle" id="mainSubtitle">MAC adresiniz ile kanal yükleyin veya aktivasyon yapın.</div>



<div class="card">

<h3 id="section1Title">1. Kanal Listesi (M3U) Yükle</h3>

<div id="accountBadge" class="account-badge" style="display:none;"></div>

<div class="input-group">

<label class="lblMac">MAC Adresi</label>

<input type="text" id="m3uMac" placeholder="Örn: AA:BB:CC:DD:EE:FF">

</div>

<div class="input-group">

<label id="lblM3uUrl">M3U Plus URL (Yöntem A)</label>

<input type="text" id="m3uUrl" placeholder="https://domain.com?...">

</div>

<button class="btn btn-blue" id="btnSendUrl" onclick="uploadPlaylistUrl()">M3U Linki Gönder</button>

<div class="divider" id="txtOr">Veya</div>

<div class="input-group">

<label id="lblM3uFile">M3U / M3U8 Dosyası Seç (Yöntem B)</label>

<div class="instructions" id="txtInstructions"></div>

<input type="file" id="m3uFileInput" accept=".m3u, .m3u8">

</div>

<button class="btn btn-orange" id="btnSendFile" onclick="uploadPlaylistFile()">Dosyayı Yükle ve Gönder</button>

</div>



<div class="card">

<h3 id="section2Title">2. 1 Yıllık Lisans Aktif Et</h3>

<p style="font-size: 13px; color: #aaa; margin: 0 0 15px 0;" id="txtPayDesc"></p>

<div class="input-group">

<label class="lblMac">MAC Adresi</label>

<input type="text" id="payMac" placeholder="Örn: AA:BB:CC:DD:EE:FF">

</div>

<button class="btn btn-orange" id="btnPay" onclick="redirectToPayment()">Ödeme Yap ve Aktif Et</button>

</div>

</div>



<script>

// --- KONFİGÜRASYON ---

const firebaseConfig = {

    apiKey: "AIzaSyAZq37V4NtdHdjiN5GUk43omDSxz7toW10",

    databaseURL: "https://zziptv-player-control-default-rtdb.europe-west1.firebasedatabase.app",

    projectId: "zziptv-player-control"

};

firebase.initializeApp(firebaseConfig);

const database = firebase.database();

const auth = firebase.auth();



// URL Parametreleri

const urlParams = new URLSearchParams(window.location.search);

const paramMac = urlParams.get('mac');

const paramUid = urlParams.get('uid');

const paramEmail = urlParams.get('email');



// Güvenli Giriş Başlat

document.getElementById('loadingOverlay').style.display = 'flex';

auth.signInAnonymously().then(() => {

    document.getElementById('loadingOverlay').style.display = 'none';

    console.log("Güvenli bağlantı başarılı.");

}).catch((error) => {

    alert("Güvenlik Hatası: Firebase Authentication devre dışı olabilir. Lütfen geliştiriciye bildirin.");

});



const langData = {

    tr: {

        title: "ZZ XTREAM - Yönetim ve Aktivasyon Merkezi",

        mainTitle: "ZZ XTREAM Kontrol Paneli",

        mainSubtitle: "MAC adresiniz ile kanal yükleyin veya aktivasyon yapın.",

        section1Title: "1. Kanal Listesi (M3U) Yükle",

        lblMac: "MAC Adresi",

        lblM3uUrl: "M3U Plus URL (Yöntem A)",

        btnSendUrl: "M3U Linki Gönder",

        txtOr: "Veya",

        lblM3uFile: "M3U / M3U8 Dosyası Seç (Yöntem B)",

        instructions: "<strong>Nasıl Yapılır?</strong><br>1. Cihazınızdaki <strong>.m3u</strong> veya <strong>.m3u8</strong> dosyanızı seçin.<br>2. \"Dosyayı Yükle ve Gönder\" butonuna basın.",

        btnSendFile: "Dosyayı Yükle ve Gönder",

        section2Title: "2. 1 Yıllık Lisans Aktif Et",

        txtPayDesc: "7 günlük deneme süreniz dolduysa veya 1 yıllık (365 gün) kullanmak istiyorsanız buradan ödeme yapın.",

        btnPay: "Ödeme Yap ve Aktif Et",

        alertValid: "Lütfen geçerli bir MAC Adresi ve bir dosya seçin.",

        alertSuccess: "M3U içeriğiniz başarıyla yüklendi!",

        alertPayProgress: "Ödeme sistemi iyzico onay sürecindedir. Lütfen daha sonra tekrar deneyin.",

        accountBadge: "Bağlı hesap: "

    },

    en: {

        title: "ZZ XTREAM - Management & Activation Center",

        mainTitle: "ZZ XTREAM Control Panel",

        mainSubtitle: "Upload playlists or activate your device via your MAC address.",

        section1Title: "1. Upload Channel List (M3U)",

        lblMac: "MAC Address",

        lblM3uUrl: "M3U Plus URL (Method A)",

        btnSendUrl: "Send M3U Link",

        txtOr: "Or",

        lblM3uFile: "Select M3U / M3U8 File (Method B)",

        instructions: "<strong>How to do?</strong><br>1. Select your <strong>.m3u</strong> or <strong>.m3u8</strong> file on your device.<br>2. Press the \"Upload and Send File\" button.",

        btnSendFile: "Upload and Send File",

        section2Title: "2. Activate 1-Year License",

        txtPayDesc: "If your 7-day trial has expired or you want 1-year (365 days) access, make your payment here.",

        btnPay: "Pay and Activate Now",

        alertValid: "Please enter a valid MAC Address and select a file.",

        alertSuccess: "Your M3U content has been uploaded successfully!",

        alertPayProgress: "Payment system is under iyzico approval. Please try again later.",

        accountBadge: "Connected account: "

    }

};



let currentLang = 'tr';



function setLanguage(lang) {

    currentLang = lang;

    document.getElementById('btnLangTR').classList.toggle('active', lang === 'tr');

    document.getElementById('btnLangEN').classList.toggle('active', lang === 'en');

    document.getElementById('siteTitle').innerText = langData[lang].title;

    document.getElementById('mainTitle').innerText = langData[lang].mainTitle;

    document.getElementById('mainSubtitle').innerText = langData[lang].mainSubtitle;

    document.getElementById('section1Title').innerText = langData[lang].section1Title;

    document.getElementById('lblM3uUrl').innerText = langData[lang].lblM3uUrl;

    document.getElementById('btnSendUrl').innerText = langData[lang].btnSendUrl;

    document.getElementById('txtOr').innerText = langData[lang].txtOr;

    document.getElementById('lblM3uFile').innerText = langData[lang].lblM3uFile;

    document.getElementById('txtInstructions').innerHTML = langData[lang].instructions;

    document.getElementById('btnSendFile').innerText = langData[lang].btnSendFile;

    document.getElementById('section2Title').innerText = langData[lang].section2Title;

    document.getElementById('txtPayDesc').innerText = langData[lang].txtPayDesc;

    document.getElementById('btnPay').innerText = langData[lang].btnPay;

    document.querySelectorAll('.lblMac').forEach(el => el.innerText = langData[lang].lblMac);

    updateAccountBadge();

}



function updateAccountBadge() {

    const badge = document.getElementById('accountBadge');

    if (paramUid) {

        badge.style.display = 'block';

        badge.innerText = langData[currentLang].accountBadge + (paramEmail ? paramEmail : paramUid);

    } else {

        badge.style.display = 'none';

    }

}



window.addEventListener('DOMContentLoaded', () => {

    if (paramMac) {

        ['m3uMac', 'payMac'].forEach(id => {

            const el = document.getElementById(id);

            if (el) { el.value = paramMac; el.readOnly = true; }

        });

    }

    setLanguage('tr');

});



function sanitizeMac(mac) { return mac.trim().replace(/[:\-\s]/g, "").toLowerCase(); }



function getTargetRef(cleanMac) {

    // Kurallara uyumlu hedef belirleme

    if (paramUid) return database.ref('playlists/' + cleanMac + '/' + paramUid);

    return database.ref('playlists/' + cleanMac);

}



function uploadPlaylistUrl() {

    const mac = document.getElementById('m3uMac').value;

    const url = document.getElementById('m3uUrl').value;

    if (!mac || !url) return alert(langData[currentLang].alertValid);

    

    getTargetRef(sanitizeMac(mac)).set({

        type: 'url',

        content: url.trim(),

        updatedAt: Date.now()

    }).then(() => {

        alert(langData[currentLang].alertSuccess);

        document.getElementById('m3uUrl').value = '';

    }).catch(e => alert("Yetki Hatası: " + e.message));

}



function uploadPlaylistFile() {

    const mac = document.getElementById('m3uMac').value;

    const file = document.getElementById('m3uFileInput').files[0];

    if (!mac || !file) return alert(langData[currentLang].alertValid);



    const reader = new FileReader();

    reader.onload = (e) => {

        getTargetRef(sanitizeMac(mac)).set({

            type: 'text',

            content: e.target.result.trim(),

            updatedAt: Date.now()

        }).then(() => {

            alert(langData[currentLang].alertSuccess);

            document.getElementById('m3uFileInput').value = '';

        }).catch(e => alert("Yetki Hatası: " + e.message));

    };

    reader.readAsText(file);

}



function redirectToPayment() {

    if (!document.getElementById('payMac').value) return alert(langData[currentLang].alertValid);

    alert(langData[currentLang].alertPayProgress);

}

</script>

</body>

</html>
