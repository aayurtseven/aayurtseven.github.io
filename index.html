<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZZIptv - Yönetim ve Aktivasyon Merkezi</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .container { background-color: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); text-align: center; width: 100%; max-width: 450px; }
        h2 { color: #f39c12; margin-top: 0; margin-bottom: 5px; }
        .subtitle { color: #aaaaaa; font-size: 14px; margin-bottom: 25px; }
        .card { background: #2a2a2a; padding: 20px; border-radius: 8px; margin-bottom: 20px; text-align: left; border-top: 4px solid #f39c12; }
        .card h3 { margin: 0 0 15px 0; font-size: 16px; color: #f39c12; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; color: #dddddd; font-size: 13px; }
        input { width: 100%; padding: 10px; border: 1px solid #444; border-radius: 6px; background-color: #1a1a1a; color: #fff; box-sizing: border-box; font-size: 15px; text-align: center; }
        input:focus { border-color: #f39c12; outline: none; }
        .file-input { background: #1a1a1a; padding: 10px; border: 1px dashed #555; border-radius: 6px; text-align: center; cursor: pointer; display: block; }
        .file-input input { display: none; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 5px; }
        .btn-orange { background-color: #f39c12; color: #121212; }
        .btn-orange:hover { background-color: #e67e22; }
        .btn-blue { background-color: #2980b9; color: #fff; }
        .btn-blue:hover { background-color: #3498db; }
        .divider { text-align: center; margin: 15px 0; font-size: 12px; color: #777; text-transform: uppercase; font-weight: bold; }
    </style>
    <!-- Firebase Realtime Database Kütüphaneleri -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
</head>
<body>

<div class="container">
    <h2>ZZIptv Kontrol Paneli</h2>
    <div class="subtitle">MAC adresiniz ile kanal yükleyin veya aktivasyon yapın.</div>
    
    <!-- 1. BÖLÜM: M3U KANAL YÜKLEME -->
    <div class="card">
        <h3>1. Kanal Listesi (M3U) Yükle</h3>
        <div class="input-group">
            <label>MAC Adresi</label>
            <input type="text" id="m3uMac" placeholder="Örn: AA:BB:CC:DD:EE:FF">
        </div>
        
        <!-- YÖNTEM A: LINK ILE YÜKLEME -->
        <div class="input-group">
            <label>M3U Plus URL (Yöntem A)</label>
            <input type="text" id="m3uUrl" placeholder="https://domain.com?...">
        </div>
        <button class="btn btn-blue" onclick="uploadPlaylistUrl()">M3U Linki Gönder</button>
        
        <div class="divider">Veya</div>
        
        <!-- YÖNTEM B: DOSYA ILE YÜKLEME -->
        <div class="input-group">
            <label>M3U Dosyası Yükle (Yöntem B)</label>
            <label class="file-input">
                <span id="fileLabel">Dosya Seç (.m3u)</span>
                <input type="file" id="m3uFile" accept=".m3u,.txt" onchange="updateFileLabel()">
            </label>
        </div>
        <button class="btn btn-orange" id="uploadFileBtn" onclick="uploadPlaylistFile()">M3U Dosyası Gönder</button>
    </div>
    
    <!-- 2. BÖLÜM: PREMIUM AKTİVASYON -->
    <div class="card">
        <h3>2. Ömür Boyu Lisans Aktif Et</h3>
        <p style="font-size: 13px; color: #aaa; margin: 0 0 15px 0;">7 günlük deneme süreniz dolduysa veya sınırsız kullanmak istiyorsanız buradan ödeme yapın.</p>
        <div class="input-group">
            <label>MAC Adresi</label>
            <input type="text" id="payMac" placeholder="Örn: AA:BB:CC:DD:EE:FF">
        </div>
        <button class="btn btn-orange" onclick="redirectToPayment()">Ödeme Yap ve Aktif Et</button>
    </div>
</div>

<script>
    // Sizin Gerçek Firebase Veritabanı Bilgileriniz
    const firebaseConfig = {
        databaseURL: "https://firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Sizin GitHub Bilgileriniz
    const GITHUB_USERNAME = "aayurtseven";
    const GITHUB_REPO = "zziptv.github.io";
    const GITHUB_TOKEN = "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";

    // Dosya seçildiğinde adını gösterme
    function updateFileLabel() {
        const fileInput = document.getElementById('m3uFile');
        const fileLabel = document.getElementById('fileLabel');
        if (fileInput.files.length > 0) {
            fileLabel.innerText = fileInput.files[0].name;
            fileLabel.style.color = "#00ffcc";
        }
    }

    // YÖNTEM A: M3U URL'sini Veritabanına Yazma
    function uploadPlaylistUrl() {
        var macAddress = document.getElementById('m3uMac').value.trim();
        var m3uUrl = document.getElementById('m3uUrl').value.trim();
        
        if (macAddress.length < 5 || m3uUrl.length < 10) {
            alert('Lütfen geçerli bir MAC Adresi ve M3U URL girin.');
            return;
        }
        
        database.ref('devices/' + macAddress).update({
            m3u_url: m3uUrl
        }).then(() => {
            alert('M3U linkiniz başarıyla kaydedildi!');
        }).catch((error) => {
            alert('Hata: ' + error.message);
        });
    }

    // YÖNTEM B: Dosyayı Okuyup GitHub'a Yükleme ve Veritabanına Linkleme
    function uploadPlaylistFile() {
        var macAddress = document.getElementById('m3uMac').value.trim();
        var fileInput = document.getElementById('m3uFile');
        
        if (macAddress.length < 5) {
            alert('Lütfen önce geçerli bir MAC Adresi girin.');
            return;
        }
        if (fileInput.files.length === 0) {
            alert('Lütfen yüklenecek .m3u dosyasını seçin.');
            return;
        }

        const file = fileInput.files[0];
        const btn = document.getElementById('uploadFileBtn');
        btn.innerText = "Yükleniyor... Lütfen Bekleyin";
        btn.disabled = true;

        const reader = new FileReader();
        reader.onload = function(e) {
            const content = e.target.result;
            // GitHub API için dosyayı Base64 formatına çeviriyoruz
            const base64Content = btoa(unescape(encodeURIComponent(content)));
            
            // Dosyanın GitHub'da yükleneceği yer: lists/MAC_ADRESI.m3u
            const path = "lists/" + macAddress + ".m3u";
            const url = `https://github.com{GITHUB_USERNAME}/${GITHUB_REPO}/contents/${path}`;

            // GitHub'a dosya yükleme isteği atıyoruz
            fetch(url, {
                method: "PUT",
                headers: {
                    "Authorization": `token ${GITHUB_TOKEN}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: `M3U file upload for ${macAddress}`,
                    content: base64Content
                })
            })
            .then(res => res.json())
            .then(data => {
                // Dosya başarıyla yüklendiğinde oluşacak internet indirme linki
                const downloadUrl = `https://${GITHUB_USERNAME}.github.io/${GITHUB_REPO}/lists/${macAddress}.m3u`;
                
                // Bu linki Firebase Realtime Database'deki m3u_url alanına yazıyoruz
                return database.ref('devices/' + macAddress).update({
                    m3u_url: downloadUrl
                });
            })
            .then(() => {
                alert('M3U dosyanız başarıyla yüklendi ve cihazınıza bağlandı!');
                btn.innerText = "M3U Dosyası Gönder";
                btn.disabled = false;
            })
            .catch(error => {
                alert('Yükleme hatası: ' + error.message);
                btn.innerText = "M3U Dosyası Gönder";
                btn.disabled = false;
            });
        };
        reader.readAsText(file);
    }

    // Ödeme Sayfasına Yönlendirme
    function redirectToPayment() {
        var macAddress = document.getElementById('payMac').value.trim();
        if (macAddress.length < 5) {
            alert('Lütfen geçerli bir MAC Adresi girin.');
            return;
        }
        var payhipUrl = "https://payhip.com[custom][device_id]=" + macAddress;
        window.location.href = payhipUrl;
    }
</script>

</body>
</html>
