/* --- DİNAMİK ARKA PLAN VE DALGA EFEKTLERİ --- */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #ffffff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
    box-sizing: border-box;
    position: relative;
    overflow-x: hidden;
    background: linear-gradient(to bottom, #190033 0%, #3a0ca3 45%, #4cc9f0 50%, #2b0b42 100%);
    background-size: 100% 200vh;
}

/* Yıldız Parıldama Efekti */
.stars {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 50%;
    pointer-events: none;
    background-image: 
        radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 160px 120px, #ffd700, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 230px 80px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 350px 150px, #ffffff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 450px 50px, #ffd700, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 550px 110px, #ffffff, rgba(0,0,0,0));
    background-repeat: repeat;
    background-size: 600px 300px;
    animation: twinkle 4s infinite alternate;
    z-index: 1;
}

@keyframes twinkle {
    0% { opacity: 0.5; }
    50% { opacity: 1; }
    100% { opacity: 0.4; }
}

/* Deniz Dalga Efekti */
.ocean-waves {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 50vh;
    pointer-events: none;
    z-index: 1;
    overflow: hidden;
    opacity: 0.4;
}

.wave {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 200%;
    height: 100px;
    background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"><path d="M0,0 C150,90 350,-40 500,40 C650,120 900,20 1200,60 L1200,120 L0,120 Z" fill="%234361ee"/></svg>');
    background-repeat: repeat-x;
    background-size: 50% 100px;
}

.wave.wave1 {
    animation: waveAnimation 12s linear infinite;
    z-index: 2;
    opacity: 0.7;
    animation-delay: 0s;
}

.wave.wave2 {
    bottom: 10px;
    animation: waveAnimation 8s linear infinite;
    z-index: 1;
    opacity: 0.5;
    animation-delay: -3s;
    background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"><path d="M0,30 C200,100 400,0 600,50 C800,100 1000,10 1200,40 L1200,120 L0,120 Z" fill="%237209b7"/></svg>');
    background-size: 50% 90px;
}

@keyframes waveAnimation {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
}
