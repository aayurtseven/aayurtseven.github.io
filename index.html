<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="siteTitle">ZZ XTREAM - Yönetim Merkezi</title>
<style>
:root { --primary: #2196F3; --secondary: #9C27B0; --dark-bg: #0d041a; --surface: rgba(30, 41, 59, 0.85); }
body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: var(--dark-bg); color: #ffffff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; overflow-x: hidden; }
.wave-container { position: fixed; width: 100%; height: 100%; top: 0; left: 0; z-index: -1; background: linear-gradient(to bottom, #0d041a, #1a0b3d); }
.wave { position: absolute; bottom: 0; left: 0; width: 200%; height: 100%; background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"><path d="M0,30 C150,110 350,0 600,30 C850,60 1050,110 1200,30 L1200,120 L0,120 Z" fill="rgba(156, 39, 176, 0.08)"/></svg>'); background-repeat: repeat-x; background-size: 50% 120px; animation: wave-move 20s linear infinite; }
@keyframes wave-move { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.container { background: var(--surface); padding: 35px; border-radius: 32px; box-shadow: 0 25px 60px rgba(0,0,0,0.7); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.12); text-align: center; width: 90%; max-width: 480px; z-index: 10; margin: 20px; }
h2 { font-weight: 900; margin-bottom: 0; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 5px 15px rgba(0,0,0,0.5); }
.neon-line { width: 100%; height: 3px; background: linear-gradient(90deg, transparent, var(--primary), var(--secondary), transparent); margin: 15px auto 25px; border-radius: 10px; box-shadow: 0 0 15px var(--primary); }
.card { background: rgba(15, 23, 42, 0.5); padding: 22px; border-radius: 22px; margin-bottom: 25px; text-align: left; border: 1px solid rgba(255,255,255,0.08); }
.cube-btn { position: relative; width: 100%; height: 52px; border: none; background: transparent; cursor: pointer; margin-top: 12px; outline: none; }
.cube-btn .btn-side { position: absolute; top: 5px; left: 0; width: 100%; height: 100%; border-radius: 15px; z-index: 1; }
.cube-btn .btn-top { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; border-radius: 15px; color: white; font-weight: 900; font-size: 14px; transition: all 0.1s; z-index: 2; border: 1px solid rgba(255,255,255,0.25); text-transform: uppercase; }
.cube-btn:active .btn-top { transform: translateY(4px); }
.btn-blue .btn-top { background: linear-gradient(180deg, #42a5f5, #2196f3); }
.btn-blue .btn-side { background: #0d47a1; }
.btn-purple .btn-top { background: linear-gradient(180deg, #ab47bc, #9c27b0); }
.btn-purple .btn-side { background: #4a148c; }
input[type="text"], input[type="file"] { width: 100%; padding: 14px; border: 1px solid rgba(255,255,255,0.15); border-radius: 14px; background: rgba(0,0,0,0.5); color: #fff; box-sizing: border-box; font-size: 14px; outline: none; }
#loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark-bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body>
<div class="wave-container"><div class="wave"></div><div class="wave" style="bottom:5px; opacity:0.5;"></div></div>
<div id="loadingOverlay">
    <div style="color: #fff; font-weight: bold; font-size: 20px; margin-bottom: 10px; letter-spacing: 2px;">ZZ XTREAM</div>
    <div id="statusText" style="color: var(--primary); font-size: 14px; font-weight: bold;">BAĞLANILIYOR...</div>
</div>
<div class="container">
    <h2>ZZ XTREAM PLAYER</h2>
    <div class="neon-line"></div>
    <div class="card">
        <h3 style="margin-top:0; font-size:14px; color:var(--primary);">KANAL LİSTESİ YÜKLE</h3>
        <input type="text" id="m3uMac" placeholder="MAC ADRESİ" style="margin-bottom: 15px;">
        <input type="text" id="m3uUrl" placeholder="M3U PLUS URL" style="margin-bottom: 10px;">
        <button class="cube-btn btn-blue" onclick="uploadPlaylistUrl()"><span class="btn-side"></span><span class="btn-top">LİNKİ GÖNDER</span></button>
        <div style="text-align:center; margin: 15px 0; font-size: 11px; color: rgba(255,255,255,0.2); font-weight: 900;">VEYA</div>
        <input type="file" id="m3uFileInput" accept=".m3u, .m3u8" style="margin-bottom: 10px;">
        <button class="cube-btn btn-purple" onclick="uploadPlaylistFile()"><span class="btn-side"></span><span class="btn-top">DOSYAYI YÜKLE</span></button>
    </div>
</div>
<script>
const part1 = "AIzaSyAZq37V4Ntd"; const part2 = "HdjiN5GUk43omDSxz7toW10";
const firebaseConfig = { apiKey: part1 + part2, databaseURL: "https://zziptv-player-control-default-rtdb.europe-west1.firebasedatabase.app", projectId: "zziptv-player-control" };
firebase.initializeApp(firebaseConfig);
const database = firebase.database();
const auth = firebase.auth();

// URL parametrelerini al
const urlParams = new URLSearchParams(window.location.search);
const paramMac = urlParams.get('mac');
if (paramMac) document.getElementById('m3uMac').value = paramMac;

// Oturum Aç
auth.signInAnonymously().then(() => {
    document.getElementById('loadingOverlay').style.display = 'none';
}).catch(e => {
    console.error("Auth Hatası:", e);
    document.getElementById('statusText').innerText = "YETKİ HATASI: Domain izinlerini kontrol edin.";
    setTimeout(() => { document.getElementById('loadingOverlay').style.display = 'none'; }, 3000);
});

function sanitizeMac(mac) { return mac.trim().replace(/[:\-\s]/g, "").toLowerCase(); }

function uploadPlaylistUrl() {
    const mac = document.getElementById('m3uMac').value;
    const url = document.getElementById('m3uUrl').value;
    if (!mac || !url) return alert("Eksik bilgi!");
    
    database.ref('playlists/' + sanitizeMac(mac)).set({
        type: 'url', content: url.trim(), updatedAt: Date.now()
    }).then(() => alert("Başarıyla kaydedildi!")).catch(e => alert("Hata: " + e.message));
}

function uploadPlaylistFile() {
    const mac = document.getElementById('m3uMac').value;
    const file = document.getElementById('m3uFileInput').files[0];
    if (!mac || !file) return alert("Eksik bilgi!");

    const reader = new FileReader();
    reader.onload = (e) => {
        database.ref('playlists/' + sanitizeMac(mac)).set({
            type: 'text', content: e.target.result.trim(), updatedAt: Date.now()
        }).then(() => alert("Dosya yüklendi!")).catch(e => alert("Hata: " + e.message));
    };
    reader.readAsText(file);
}
</script>
</body>
</html>
