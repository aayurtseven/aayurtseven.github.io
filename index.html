<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="siteTitle">ZZ XTREAM - Yönetim Merkezi</title>
<style>
:root {
    --primary: #2196F3;
    --secondary: #9C27B0;
    --dark-bg: #0d041a;
    --surface: rgba(30, 41, 59, 0.7);
}

body { 
    font-family: 'Segoe UI', Roboto, sans-serif; 
    background-color: var(--dark-bg); 
    color: #ffffff; 
    display: flex; 
    justify-content: center; 
    align-items: center; 
    min-height: 100vh; 
    margin: 0; 
    overflow-x: hidden;
    position: relative;
}

/* --- LİKİT DALGA ARKA PLANI --- */
.wave-container {
    position: fixed;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    z-index: -1;
    background: linear-gradient(to bottom, #0d041a, #1a0b3d);
}

.wave {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 200%;
    height: 100%;
    background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"><path d="M0,30 C150,110 350,0 600,30 C850,60 1050,110 1200,30 L1200,120 L0,120 Z" fill="rgba(156, 39, 176, 0.08)"/></svg>');
    background-repeat: repeat-x;
    background-size: 50% 120px;
    animation: wave-move 15s linear infinite;
}

.wave:nth-child(2) {
    bottom: 10px;
    height: 95%;
    background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 1200 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"><path d="M0,30 C150,110 350,0 600,30 C850,60 1050,110 1200,30 L1200,120 L0,120 Z" fill="rgba(33, 150, 243, 0.04)"/></svg>');
    animation: wave-move 10s linear infinite reverse;
}

@keyframes wave-move {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
}

.sparkle {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: 0;
    animation: sparkle-fade 3s infinite;
}

@keyframes sparkle-fade {
    0%, 100% { opacity: 0; transform: scale(0); }
    50% { opacity: 0.4; transform: scale(1); }
}

/* --- KAPSAYICI VE KARTLAR --- */
.container { 
    background: var(--surface); 
    padding: 30px; 
    border-radius: 28px; 
    box-shadow: 0 20px 50px rgba(0,0,0,0.6); 
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.1);
    text-align: center; 
    width: 90%; 
    max-width: 460px; 
    z-index: 10;
    margin: 20px;
}

h2 { color: #fff; font-weight: 900; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
.neon-line { width: 80%; height: 3px; background: linear-gradient(90deg, transparent, var(--primary), var(--secondary), transparent); margin: 15px auto 25px; border-radius: 10px; box-shadow: 0 0 15px var(--primary); }

.card { 
    background: rgba(15, 23, 42, 0.5); 
    padding: 20px; 
    border-radius: 20px; 
    margin-bottom: 25px; 
    text-align: left; 
    border: 1px solid rgba(255,255,255,0.05);
    box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
}

.card h3 { margin: 0 0 15px 0; font-size: 15px; color: var(--primary); font-weight: 800; display: flex; align-items: center; gap: 8px; }

/* --- 3D KÜP TUŞLAR --- */
.cube-btn {
    position: relative;
    width: 100%;
    height: 50px;
    border: none;
    background: transparent;
    cursor: pointer;
    margin-top: 10px;
    outline: none;
}

.cube-btn .btn-side {
    position: absolute;
    top: 4px;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 14px;
    z-index: 1;
}

.cube-btn .btn-top {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    color: white;
    font-weight: 900;
    font-size: 14px;
    transition: transform 0.1s;
    z-index: 2;
    border: 1px solid rgba(255,255,255,0.2);
    box-sizing: border-box;
}

.cube-btn:active .btn-top {
    transform: translateY(3px);
}

.btn-blue .btn-top { background: linear-gradient(180deg, #42a5f5 0%, #2196f3 100%); }
.btn-blue .btn-side { background: #0d47a1; }
.btn-orange .btn-top { background: linear-gradient(180deg, #ab47bc 0%, #9c27b0 100%); }
.btn-orange .btn-side { background: #4a148c; }

input[type="text"], input[type="file"] { 
    width: 100%; padding: 12px; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; 
    background: rgba(0,0,0,0.4); color: #fff; box-sizing: border-box; font-size: 14px; 
}
input:focus { border-color: var(--primary); outline: none; background: rgba(0,0,0,0.6); }

.account-badge { background: rgba(33, 150, 243, 0.15); padding: 12px; border-radius: 14px; font-size: 13px; color: #90caf9; margin-bottom: 20px; border: 1px solid rgba(33, 150, 243, 0.3); font-weight: bold; }

#loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--dark-bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
.loader { width: 40px; height: 40px; border: 4px solid #fff; border-bottom-color: var(--primary); border-radius: 50%; display: inline-block; box-sizing: border-box; animation: rotation 1s linear infinite; margin-bottom: 20px; }
@keyframes rotation { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body>

<div class="wave-container" id="waveContainer">
    <div class="wave"></div>
    <div class="wave"></div>
</div>

<div id="loadingOverlay">
    <span class="loader"></span>
    <div style="color: #fff; font-weight: bold; letter-spacing: 1px;">GÜVENLİ BAĞLANTI...</div>
</div>

<div class="container">
    <h2>ZZ XTREAM PLAYER</h2>
    <div class="neon-line"></div>
    <div class="subtitle" id="mainSubtitle"></div>

    <div class="card">
        <h3 id="section1Title"></h3>
        <div id="accountBadge" class="account-badge" style="display:none;"></div>
        
        <div style="margin-bottom: 15px;">
            <input type="text" id="m3uMac" placeholder="MAC ADRESİ">
        </div>
        
        <div style="margin-bottom: 15px;">
            <input type="text" id="m3uUrl" placeholder="M3U PLUS URL">
            <button class="cube-btn btn-blue" onclick="uploadPlaylistUrl()">
                <span class="btn-side"></span>
                <span class="btn-top" id="btnSendUrl"></span>
            </button>
        </div>

        <div style="text-align:center; margin: 20px 0; font-size: 11px; color: rgba(255,255,255,0.3); font-weight: 900;">- VEYA -</div>

        <div>
            <div id="txtInstructions" style="font-size: 12px; color: #ce93d8; margin-bottom: 12px; background: rgba(156,39,176,0.1); padding: 10px; border-radius: 10px; border-left: 3px solid var(--secondary);"></div>
            <input type="file" id="m3uFileInput" accept=".m3u, .m3u8">
            <button class="cube-btn btn-orange" onclick="uploadPlaylistFile()">
                <span class="btn-side"></span>
                <span class="btn-top" id="btnSendFile"></span>
            </button>
        </div>
    </div>

    <div class="card">
        <h3 id="section2Title"></h3>
        <p id="txtPayDesc" style="font-size: 12px; color: rgba(255,255,255,0.5); margin-bottom: 15px; line-height: 1.5;"></p>
        <input type="text" id="payMac" placeholder="MAC ADRESİ">
        <button class="cube-btn btn-blue" onclick="redirectToPayment()">
            <span class="btn-side"></span>
            <span class="btn-top" id="btnPay"></span>
        </button>
    </div>
</div>

<script>
// --- PARILDAMA SİSTEMİ ---
function createSparkles() {
    const container = document.getElementById('waveContainer');
    for(let i=0; i<40; i++) {
        const s = document.createElement('div');
        s.className = 'sparkle';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.width = s.style.height = (Math.random() * 3 + 1) + 'px';
        s.style.animationDelay = Math.random() * 5 + 's';
        container.appendChild(s);
    }
}
createSparkles();

// --- FIREBASE ---
const part1 = "AIzaSyAZq37V4Ntd";
const part2 = "HdjiN5GUk43omDSxz7toW10";

const firebaseConfig = {
    apiKey: part1 + part2,
    databaseURL: "https://zziptv-player-control-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "zziptv-player-control"
};
firebase.initializeApp(firebaseConfig);
const database = firebase.database();
const auth = firebase.auth();

const urlParams = new URLSearchParams(window.location.search);
const paramMac = urlParams.get('mac');
const paramUid = urlParams.get('uid');
const paramEmail = urlParams.get('email');

auth.signInAnonymously().then(() => {
    document.getElementById('loadingOverlay').style.display = 'none';
}).catch(e => {
    console.error(e);
    document.getElementById('loadingOverlay').innerHTML = "<div style='color:red'>Bağlantı Hatası!</div>";
});

const langData = {
    tr: {
        mainSubtitle: "Listenizi yükleyin ve Premium özelliklerin tadını çıkarın.",
        section1Title: "1. KANAL LİSTESİ YÜKLE",
        btnSendUrl: "M3U LİNKİ GÖNDER",
        instructions: "Cihazınızdaki .m3u veya .m3u8 dosyasını seçip yükleyin.",
        btnSendFile: "DOSYAYI YÜKLE VE GÖNDER",
        section2Title: "2. LİSANS AKTİF ET",
        txtPayDesc: "7 günlük deneme bittiyse 1 yıllık (365 gün) tam erişim için buradan devam edin.",
        btnPay: "ÖDEME YAP VE AKTİF ET",
        accountBadge: "BAĞLI HESAP: "
    },
    en: {
        mainSubtitle: "Upload your list and enjoy Premium features.",
        section1Title: "1. UPLOAD CHANNEL LIST",
        btnSendUrl: "SEND M3U LINK",
        instructions: "Select and upload the .m3u/.m3u8 file from your device.",
        btnSendFile: "UPLOAD AND SEND FILE",
        section2Title: "2. ACTIVATE 1-YEAR LICENSE",
        txtPayDesc: "Trial expired? Pay here for 1-year (365 days) unlimited access.",
        btnPay: "PAY AND ACTIVATE NOW",
        accountBadge: "ACCOUNT: "
    }
};

function setLanguage(lang) {
    document.getElementById('mainSubtitle').innerText = langData[lang].mainSubtitle;
    document.getElementById('section1Title').innerText = langData[lang].section1Title;
    document.getElementById('btnSendUrl').innerText = langData[lang].btnSendUrl;
    document.getElementById('txtInstructions').innerText = langData[lang].instructions;
    document.getElementById('btnSendFile').innerText = langData[lang].btnSendFile;
    document.getElementById('section2Title').innerText = langData[lang].section2Title;
    document.getElementById('txtPayDesc').innerText = langData[lang].txtPayDesc;
    document.getElementById('btnPay').innerText = langData[lang].btnPay;
    updateAccountBadge(lang);
}

function updateAccountBadge(lang) {
    const badge = document.getElementById('accountBadge');
    if (paramUid) {
        badge.style.display = 'block';
        badge.innerText = langData[lang].accountBadge + (paramEmail ? paramEmail : paramUid);
    }
}

window.addEventListener('DOMContentLoaded', () => {
    if (paramMac) {
        ['m3uMac', 'payMac'].forEach(id => {
            const el = document.getElementById(id);
            if (el) { el.value = paramMac; el.readOnly = true; }
        });
    }
    setLanguage('tr');
});

function sanitizeMac(mac) { return mac.trim().replace(/[:\-\s]/g, "").toLowerCase(); }
function getTargetRef(cleanMac) {
    return paramUid ? database.ref('playlists/' + cleanMac + '/' + paramUid) : database.ref('playlists/' + cleanMac);
}

function uploadPlaylistUrl() {
    const mac = document.getElementById('m3uMac').value;
    const url = document.getElementById('m3uUrl').value;
    if (!mac || !url) return alert("Lütfen tüm alanları doldurun.");
    
    getTargetRef(sanitizeMac(mac)).set({
        type: 'url', content: url.trim(), updatedAt: Date.now()
    }).then(() => alert("Liste başarıyla kaydedildi!")).catch(e => alert("Hata: " + e.message));
}

function uploadPlaylistFile() {
    const mac = document.getElementById('m3uMac').value;
    const file = document.getElementById('m3uFileInput').files[0];
    if (!mac || !file) return alert("Lütfen MAC adresi ve bir dosya seçin.");

    const reader = new FileReader();
    reader.onload = (e) => {
        getTargetRef(sanitizeMac(mac)).set({
            type: 'text', content: e.target.result.trim(), updatedAt: Date.now()
        }).then(() => alert("Dosya başarıyla yüklendi!")).catch(e => alert("Hata: " + e.message));
    };
    reader.readAsText(file);
}

function redirectToPayment() { alert("Ödeme sistemi iyzico onay sürecindedir."); }
</script>
</body>
</html>
