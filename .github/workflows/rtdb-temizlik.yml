name: RTDB e-posta temizligi

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "report = sadece listele · fix = duzelt"
        required: true
        default: "report"
        type: choice
        options:
          - report
          - fix

jobs:
  temizlik:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: firebase-admin kur
        run: npm init -y >/dev/null 2>&1 && npm i firebase-admin@12 --no-fund --no-audit

      - name: Servis anahtarini gecici yaz
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > sa.json

      - name: Temizligi calistir
        env:
          GOOGLE_APPLICATION_CREDENTIALS: sa.json
        run: node zz-eposta-temizlik.js ${{ inputs.mode }}

      - name: Anahtari sil
        if: always()
        run: rm -f sa.json
